# Lisää nämä kaksi lohkoa OLEMASSA OLEVAAN server { } -lohkoon,
# SAMAAN tiedostoon jossa viikon 2 "location / { proxy_pass ... }" on.
# Löydä tiedosto:  grep -rn proxy_pass /etc/nginx/sites-enabled/
#
# nginx valitsee pisimmän täsmäävän prefixin, joten /viikko3/ menee tänne
# ja kaikki muu edelleen viikon 2 sovellukselle.

    # /viikko3 ilman kauttaviivaa -> ohjaa oikeaan osoitteeseen
    location = /viikko3 {
        return 301 /viikko3/;
    }

    # /viikko3/ -> staattiset tiedostot hakemistosta /var/www/viikko3/
    location /viikko3/ {
        root /var/www;              # /viikko3/x -> /var/www/viikko3/x
        index index.html;
        add_header Cache-Control "no-store";   # selain hakee aina tuoreen raportin
    }

# Tarkista ja ota käyttöön:
#   sudo nginx -t && sudo systemctl reload nginx
